name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    name: RLS policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every table enables RLS
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            tables=$(grep -oiE 'create table (if not exists )?public\.[a-z_]+' "$f" | awk '{print $NF}' | sort -u)
            for t in $tables; do
              grep -qiE "alter table $t enable row level security" "$f" || { echo "::error::$t in $f has no RLS"; exit 1; }
            done
          done
      - name: No open policies for clients
        run: |
          ! grep -nE 'using \(true\)' supabase/migrations/*.sql || { echo "::error::policy using (true) found"; exit 1; }


  # The app, typecheck, test and CodeQL jobs are added in US-1, when package.json exists.
